<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="390" height="844" rx="0"/></clipPath>
  </defs>
  
  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="url(#bg)"/>
    
    <!-- Status bar -->
    <rect width="390" height="50" fill="#f8f9fb"/>
    <text x="32" y="32" font-size="14" font-weight="600" fill="#1e293b">9:41</text>
    <rect x="308" y="22" width="18" height="10" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="310" y="24" width="12" height="6" rx="1" fill="#1e293b"/>
    
    <!-- Title -->
    <text x="24" y="86" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">设置</text>
    
    <!-- Connection section -->
    <text x="24" y="126" font-size="13" font-weight="600" fill="#94a3b8" text-transform="uppercase">连接</text>
    
    <g filter="url(#cardShadow)">
      <rect x="20" y="138" width="350" height="120" rx="14" fill="white"/>
      <!-- Desktop URL -->
      <g transform="translate(20, 16)">
        <text x="0" y="12" font-size="13" font-weight="500" fill="#64748b">桌面端地址</text>
        <text x="0" y="34" font-size="15" font-weight="500" fill="#0f172a">https://localhost:8877</text>
      </g>
      <line x1="20" y1="62" x2="330" y2="62" stroke="#f1f5f9" stroke-width="1"/>
      <!-- Token -->
      <g transform="translate(20, 72)">
        <text x="0" y="12" font-size="13" font-weight="500" fill="#64748b">认证令牌</text>
        <text x="0" y="34" font-size="15" font-weight="500" fill="#0f172a">••••••••••••••••</text>
        <text x="280" y="34" font-size="13" font-weight="600" fill="#2563eb">复制</text>
      </g>
    </g>
    
    <!-- Language section -->
    <text x="24" y="300" font-size="13" font-weight="600" fill="#94a3b8">语言</text>
    
    <g filter="url(#cardShadow)">
      <rect x="20" y="312" width="350" height="56" rx="14" fill="white"/>
      <g transform="translate(20, 14)">
        <text x="0" y="14" font-size="15" font-weight="500" fill="#0f172a">界面语言</text>
        <text x="280" y="14" font-size="15" fill="#2563eb" text-anchor="end">中文</text>
        <text x="320" y="14" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
      </g>
    </g>
    
    <!-- Data section -->
    <text x="24" y="400" font-size="13" font-weight="600" fill="#94a3b8">数据</text>
    
    <g filter="url(#cardShadow)">
      <rect x="20" y="412" width="350" height="120" rx="14" fill="white"/>
      <!-- Status -->
      <g transform="translate(20, 16)">
        <text x="0" y="12" font-size="13" font-weight="500" fill="#64748b">状态</text>
        <text x="0" y="34" font-size="15" font-weight="500" fill="#059669">已连接</text>
      </g>
      <line x1="20" y1="62" x2="330" y2="62" stroke="#f1f5f9" stroke-width="1"/>
      <!-- Offline cache -->
      <g transform="translate(20, 72)">
        <text x="0" y="14" font-size="15" font-weight="500" fill="#0f172a">离线缓存</text>
        <g transform="translate(288, 0)">
          <rect width="44" height="24" rx="12" fill="#2563eb"/>
          <circle cx="32" cy="12" r="9" fill="white"/>
        </g>
      </g>
    </g>
    
    <!-- About section -->
    <text x="24" y="570" font-size="13" font-weight="600" fill="#94a3b8">关于</text>
    
    <g filter="url(#cardShadow)">
      <rect x="20" y="582" width="350" height="56" rx="14" fill="white"/>
      <g transform="translate(20, 14)">
        <text x="0" y="14" font-size="15" font-weight="500" fill="#0f172a">版本</text>
        <text x="280" y="14" font-size="15" fill="#94a3b8" text-anchor="end">v0.1.0</text>
      </g>
    </g>
    
    <!-- Status indicator -->
    <g transform="translate(20, 664)">
      <rect width="350" height="44" rx="12" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
      <circle cx="28" cy="22" r="4" fill="#10b981"/>
      <text x="40" y="27" font-size="13" fill="#059669">桌面端已连接 — 本地网络模式</text>
    </g>
    
    <!-- Bottom nav -->
    <rect x="0" y="780" width="390" height="64" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <g opacity="0.4">
      <text x="65" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">📚</text>
      <text x="65" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">书架</text>
    </g>
    <g opacity="0.4">
      <text x="185" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">💬</text>
      <text x="185" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">对话</text>
    </g>
    <g opacity="0.4">
      <text x="265" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">📊</text>
      <text x="265" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">统计</text>
    </g>
    <g opacity="1">
      <circle cx="325" cy="794" r="2" fill="#2563eb"/>
      <text x="325" y="828" font-size="20" fill="#2563eb" text-anchor="middle">⚙️</text>
      <text x="325" y="816" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">设置</text>
    </g>
    <rect x="130" y="836" width="130" height="5" rx="2.5" fill="#1e293b" opacity="0.2"/>
  </g>
</svg>
