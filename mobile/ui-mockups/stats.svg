<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="390" height="844" rx="0"/></clipPath>
  </defs>
  
  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="url(#bg)"/>
    
    <!-- Status bar -->
    <rect width="390" height="50" fill="#f8f9fb"/>
    <text x="32" y="32" font-size="14" font-weight="600" fill="#1e293b">9:41</text>
    <rect x="308" y="22" width="18" height="10" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="310" y="24" width="12" height="6" rx="1" fill="#1e293b"/>
    
    <!-- Title -->
    <text x="24" y="86" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">统计</text>
    <text x="24" y="108" font-size="13" fill="#94a3b8" font-weight="500">全部作品汇总</text>
    
    <!-- Overview cards -->
    <g transform="translate(20, 128)">
      <!-- Card 1: Total novels -->
      <g filter="url(#cardShadow)">
        <rect width="106" height="80" rx="14" fill="white"/>
        <text x="53" y="28" font-size="28" font-weight="800" fill="#2563eb" text-anchor="middle">3</text>
        <text x="53" y="50" font-size="11" fill="#94a3b8" text-anchor="middle">小说</text>
        <text x="53" y="68" font-size="11" fill="#059669" text-anchor="middle">+1 本月</text>
      </g>
      
      <!-- Card 2: Total chapters -->
      <g transform="translate(122, 0)" filter="url(#cardShadow)">
        <rect width="106" height="80" rx="14" fill="white"/>
        <text x="53" y="28" font-size="28" font-weight="800" fill="#2563eb" text-anchor="middle">231</text>
        <text x="53" y="50" font-size="11" fill="#94a3b8" text-anchor="middle">章节</text>
        <text x="53" y="68" font-size="11" fill="#059669" text-anchor="middle">+42 本月</text>
      </g>
      
      <!-- Card 3: Total words -->
      <g transform="translate(244, 0)" filter="url(#cardShadow)">
        <rect width="106" height="80" rx="14" fill="white"/>
        <text x="53" y="28" font-size="22" font-weight="800" fill="#2563eb" text-anchor="middle">66.1万</text>
        <text x="53" y="50" font-size="11" fill="#94a3b8" text-anchor="middle">总字数</text>
        <text x="53" y="68" font-size="11" fill="#059669" text-anchor="middle">+12.3万</text>
      </g>
    </g>
    
    <!-- Writing activity chart -->
    <text x="24" y="242" font-size="16" font-weight="700" fill="#0f172a">创作趋势</text>
    
    <g filter="url(#cardShadow)">
      <rect x="20" y="254" width="350" height="140" rx="14" fill="white"/>
      
      <!-- Chart bars -->
      <g transform="translate(32, 270)">
        <!-- Week labels -->
        <text x="15" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">1月</text>
        <text x="62" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">2月</text>
        <text x="109" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">3月</text>
        <text x="156" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">4月</text>
        <text x="203" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">5月</text>
        <text x="250" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">6月</text>
        <text x="297" y="112" font-size="10" fill="#94a3b8" text-anchor="middle">7月</text>
        
        <!-- Bars -->
        <rect x="4" y="80" width="22" height="28" rx="4" fill="#e2e8f0"/>
        <rect x="51" y="60" width="22" height="48" rx="4" fill="#e2e8f0"/>
        <rect x="98" y="40" width="22" height="68" rx="4" fill="#e2e8f0"/>
        <rect x="145" y="50" width="22" height="58" rx="4" fill="#e2e8f0"/>
        <rect x="192" y="30" width="22" height="78" rx="4" fill="#93c5fd"/>
        <rect x="239" y="20" width="22" height="88" rx="4" fill="#60a5fa"/>
        <rect x="286" y="10" width="22" height="98" rx="4" fill="#2563eb"/>
        
        <!-- Trend line -->
        <polyline points="15,76 62,56 109,36 156,46 192,26 239,16 286,6" 
                  fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="286" cy="6" r="4" fill="#2563eb" stroke="white" stroke-width="2"/>
      </g>
    </g>
    
    <!-- Novel list -->
    <text x="24" y="426" font-size="16" font-weight="700" fill="#0f172a">各作品明细</text>
    
    <!-- Novel 1 -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="440" width="350" height="72" rx="14" fill="white"/>
      <g transform="translate(16, 14)">
        <rect width="40" height="44" rx="8" fill="#2563eb"/>
        <text x="20" y="28" font-size="18" font-weight="700" fill="white" text-anchor="middle">龙</text>
      </g>
      <g transform="translate(68, 14)">
        <text x="0" y="12" font-size="14" font-weight="600" fill="#0f172a">龙族之黄昏</text>
        <rect x="88" y="-2" width="36" height="16" rx="4" fill="rgba(37,99,235,0.1)"/>
        <text x="106" y="10" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">当前</text>
        <text x="0" y="36" font-size="12" fill="#94a3b8">128章 · 24角色 · 42.6万字</text>
      </g>
      <text x="330" y="36" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
    </g>
    
    <!-- Novel 2 -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="520" width="350" height="72" rx="14" fill="white"/>
      <g transform="translate(16, 14)">
        <rect width="40" height="44" rx="8" fill="#7c3aed"/>
        <text x="20" y="28" font-size="18" font-weight="700" fill="white" text-anchor="middle">月</text>
      </g>
      <g transform="translate(68, 14)">
        <text x="0" y="12" font-size="14" font-weight="600" fill="#0f172a">月光信笺</text>
        <text x="0" y="36" font-size="12" fill="#94a3b8">36章 · 12角色 · 8.3万字</text>
      </g>
      <text x="330" y="36" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
    </g>
    
    <!-- Novel 3 -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="600" width="350" height="72" rx="14" fill="white"/>
      <g transform="translate(16, 14)">
        <rect width="40" height="44" rx="8" fill="#059669"/>
        <text x="20" y="28" font-size="18" font-weight="700" fill="white" text-anchor="middle">剑</text>
      </g>
      <g transform="translate(68, 14)">
        <text x="0" y="12" font-size="14" font-weight="600" fill="#0f172a">无名剑谱</text>
        <text x="0" y="36" font-size="12" fill="#94a3b8">67章 · 18角色 · 15.2万字</text>
      </g>
      <text x="330" y="36" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
    </g>
    
    <!-- Bottom nav -->
    <rect x="0" y="780" width="390" height="64" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <g opacity="0.4">
      <text x="65" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">📚</text>
      <text x="65" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">书架</text>
    </g>
    <g opacity="0.4">
      <text x="185" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">💬</text>
      <text x="185" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">对话</text>
    </g>
    <g opacity="1">
      <circle cx="265" cy="794" r="2" fill="#2563eb"/>
      <text x="265" y="828" font-size="20" fill="#2563eb" text-anchor="middle">📊</text>
      <text x="265" y="816" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">统计</text>
    </g>
    <g opacity="0.4">
      <text x="325" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">⚙️</text>
      <text x="325" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">设置</text>
    </g>
    <rect x="130" y="836" width="130" height="5" rx="2.5" fill="#1e293b" opacity="0.2"/>
  </g>
</svg>
