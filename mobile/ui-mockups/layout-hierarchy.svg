<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="nodeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Mobile UI Layout Hierarchy</text>
  <text x="450" y="55" font-size="13" fill="#94a3b8" text-anchor="middle">Goink Mobile PWA — Component Tree</text>
  
  <!-- Level 0: App Shell -->
  <g transform="translate(300, 75)" filter="url(#nodeShadow)">
    <rect width="300" height="40" rx="8" fill="url(#headerGrad)"/>
    <text x="150" y="26" font-size="13" font-weight="600" fill="white" text-anchor="middle">App Shell (#root)</text>
  </g>
  
  <!-- Lines from App Shell -->
  <line x1="350" y1="115" x2="350" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="115" x2="450" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="115" x2="550" y2="145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 1: Pages -->
  <g transform="translate(260, 145)" filter="url(#nodeShadow)">
    <rect width="180" height="40" rx="8" fill="url(#pageGrad)"/>
    <text x="90" y="26" font-size="12" font-weight="600" fill="white" text-anchor="middle">📚 书架 (novels)</text>
  </g>
  <g transform="translate(360, 145)" filter="url(#nodeShadow)">
    <rect width="180" height="40" rx="8" fill="url(#pageGrad)"/>
    <text x="90" y="26" font-size="12" font-weight="600" fill="white" text-anchor="middle">💬 对话 (chat)</text>
  </g>
  <g transform="translate(460, 145)" filter="url(#nodeShadow)">
    <rect width="180" height="40" rx="8" fill="url(#pageGrad)"/>
    <text x="90" y="26" font-size="12" font-weight="600" fill="white" text-anchor="middle">📊 统计 / ⚙️ 设置</text>
  </g>
  
  <!-- 书架 Page children -->
  <line x1="310" y1="185" x2="200" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="350" y1="185" x2="350" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="390" y1="185" x2="500" y2="220" stroke="#94a3b8" stroke-width="1"/>
  
  <g transform="translate(120, 220)" filter="url(#nodeShadow)">
    <rect width="160" height="34" rx="6" fill="url(#compGrad)"/>
    <text x="80" y="22" font-size="11" font-weight="500" fill="white" text-anchor="middle">.novels-header</text>
  </g>
  <g transform="translate(280, 220)" filter="url(#nodeShadow)">
    <rect width="140" height="34" rx="6" fill="url(#compGrad)"/>
    <text x="70" y="22" font-size="11" font-weight="500" fill="white" text-anchor="middle">.novel-card</text>
  </g>
  <g transform="translate(420, 220)" filter="url(#nodeShadow)">
    <rect width="160" height="34" rx="6" fill="url(#compGrad)"/>
    <text x="80" y="22" font-size="11" font-weight="500" fill="white" text-anchor="middle">.novels-create-btn</text>
  </g>
  
  <!-- .novels-header children -->
  <line x1="160" y1="254" x2="120" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="200" y1="254" x2="240" y2="280" stroke="#94a3b8" stroke-width="1"/>
  
  <g transform="translate(60, 280)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novels-title</text>
  </g>
  <g transform="translate(200, 280)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novels-count</text>
  </g>
  
  <!-- .novel-card children -->
  <line x1="320" y1="254" x2="280" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="350" y1="254" x2="350" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="380" y1="254" x2="420" y2="280" stroke="#94a3b8" stroke-width="1"/>
  
  <g transform="translate(220, 280)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novel-card-top</text>
  </g>
  <g transform="translate(350, 280)" filter="url(#nodeShadow)">
    <rect width="100" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="50" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novel-stats</text>
  </g>
  <g transform="translate(460, 280)" filter="url(#nodeShadow)">
    <rect width="100" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="50" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novel-desc</text>
  </g>
  
  <!-- .novel-card-top children -->
  <line x1="260" y1="308" x2="220" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <line x1="300" y1="308" x2="300" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <line x1="340" y1="308" x2="380" y2="330" stroke="#94a3b8" stroke-width="1"/>
  
  <g transform="translate(160, 330)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novel-icon</text>
  </g>
  <g transform="translate(290, 330)" filter="url(#nodeShadow)">
    <rect width="100" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="50" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novel-info</text>
  </g>
  <g transform="translate(400, 330)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.novel-tags</text>
  </g>
  
  <!-- Novel Detail Page -->
  <g transform="translate(60, 400)" filter="url(#nodeShadow)">
    <rect width="780" height="40" rx="8" fill="url(#headerGrad)"/>
    <text x="390" y="26" font-size="13" font-weight="600" fill="white" text-anchor="middle">📖 Novel Detail Page (loadNovelDetail)</text>
  </g>
  
  <!-- Detail children -->
  <line x1="200" y1="440" x2="200" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="440" x2="450" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="440" x2="700" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <g transform="translate(100, 470)" filter="url(#nodeShadow)">
    <rect width="200" height="40" rx="8" fill="url(#pageGrad)"/>
    <text x="100" y="26" font-size="12" font-weight="500" fill="white" text-anchor="middle">.novel-detail-header</text>
  </g>
  <g transform="translate(320, 470)" filter="url(#nodeShadow)">
    <rect width="260" height="40" rx="8" fill="url(#pageGrad)"/>
    <text x="130" y="26" font-size="12" font-weight="500" fill="white" text-anchor="middle">.tab-bar (.tab-item × N)</text>
  </g>
  <g transform="translate(600, 470)" filter="url(#nodeShadow)">
    <rect width="200" height="40" rx="8" fill="url(#pageGrad)"/>
    <text x="100" y="26" font-size="12" font-weight="500" fill="white" text-anchor="middle">.data-card (list)</text>
  </g>
  
  <!-- Detail header children -->
  <line x1="150" y1="510" x2="100" y2="540" stroke="#94a3b8" stroke-width="1"/>
  <line x1="200" y1="510" x2="200" y2="540" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="510" x2="300" y2="540" stroke="#94a3b8" stroke-width="1"/>
  
  <g transform="translate(30, 540)" filter="url(#nodeShadow)">
    <rect width="140" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="70" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.detail-header-top</text>
  </g>
  <g transform="translate(180, 540)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.detail-stats</text>
  </g>
  <g transform="translate(310, 540)" filter="url(#nodeShadow)">
    <rect width="140" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="70" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.btn-delete-novel</text>
  </g>
  
  <!-- Data card children -->
  <line x1="660" y1="510" x2="600" y2="540" stroke="#94a3b8" stroke-width="1"/>
  <line x1="700" y1="510" x2="700" y2="540" stroke="#94a3b8" stroke-width="1"/>
  <line x1="740" y1="510" x2="800" y2="540" stroke="#94a3b8" stroke-width="1"/>
  
  <g transform="translate(530, 540)" filter="url(#nodeShadow)">
    <rect width="120" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="60" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.data-card-header</text>
  </g>
  <g transform="translate(660, 540)" filter="url(#nodeShadow)">
    <rect width="110" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="55" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.data-card-body</text>
  </g>
  <g transform="translate(780, 540)" filter="url(#nodeShadow)">
    <rect width="110" height="28" rx="5" fill="url(#leafGrad)"/>
    <text x="55" y="19" font-size="10" font-weight="500" fill="white" text-anchor="middle">.data-card-meta</text>
  </g>
  
  <!-- Bottom Nav -->
  <g transform="translate(60, 590)" filter="url(#nodeShadow)">
    <rect width="780" height="34" rx="8" fill="#1e293b"/>
    <text x="390" y="22" font-size="12" font-weight="500" fill="white" text-anchor="middle">底部导航 (.nav-item × 4, .nav-item.active + ::after indicator dot)</text>
  </g>
  
  <!-- CSS Variables legend -->
  <g transform="translate(60, 640)">
    <text x="0" y="12" font-size="11" font-weight="600" fill="#64748b">Design Tokens:</text>
    <rect x="100" y="0" width="10" height="10" rx="2" fill="#2563eb"/>
    <text x="115" y="10" font-size="10" fill="#64748b">--oak (accent)</text>
    <rect x="220" y="0" width="10" height="10" rx="2" fill="#059669"/>
    <text x="235" y="10" font-size="10" fill="#64748b">--jade</text>
    <rect x="310" y="0" width="10" height="10" rx="2" fill="#7c3aed"/>
    <text x="325" y="10" font-size="10" fill="#64748b">--berry</text>
    <rect x="410" y="0" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="425" y="10" font-size="10" fill="#64748b">--honey</text>
    <rect x="510" y="0" width="10" height="10" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="525" y="10" font-size="10" fill="#64748b">--surface2</text>
    <rect x="620" y="0" width="10" height="10" rx="2" fill="white" stroke="#e2e8f0"/>
    <text x="635" y="10" font-size="10" fill="#64748b">--surface-card</text>
  </g>
</svg>
