      </g>
      <text x="330" y="28" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
    </g>
    
    <!-- Chapter 123 -->
    <g transform="translate(20, 602)">
      <rect width="350" height="56" rx="12" fill="white"/>
      <g transform="translate(14, 8)">
        <rect width="36" height="40" rx="8" fill="#f1f5f9"/>
        <text x="18" y="26" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">123</text>
      </g>
      <g transform="translate(62, 8)">
        <text x="0" y="14" font-size="14" font-weight="500" fill="#334155">破碎的誓言</text>
        <text x="0" y="34" font-size="11" fill="#94a3b8">2025-01-10  2,700字</text>
      </g>
      <text x="330" y="28" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
    </g>
    
