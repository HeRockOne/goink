      </g>
      <text x="330" y="28" font-size="16" fill="#cbd5e1" text-anchor="middle">›</text>
    </g>
    
    <!-- Chapter 124 -->
    <g transform="translate(20, 538)">
      <rect width="350" height="56" rx="12" fill="white"/>
      <g transform="translate(14, 8)">
