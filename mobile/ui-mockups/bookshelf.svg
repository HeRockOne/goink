<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="novel1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="novel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="novel3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="390" height="844" rx="0"/></clipPath>
  </defs>
  
  <g clip-path="url(#screen)">
    <!-- Background -->
    <rect width="390" height="844" fill="url(#bg)"/>
    
    <!-- Status bar -->
    <rect width="390" height="50" fill="#f8f9fb"/>
    <text x="32" y="32" font-size="14" font-weight="600" fill="#1e293b">9:41</text>
    <rect x="308" y="22" width="18" height="10" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="310" y="24" width="12" height="6" rx="1" fill="#1e293b"/>
    
    <!-- Page header -->
    <text x="24" y="96" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">书架</text>
    <text x="24" y="116" font-size="13" fill="#94a3b8" font-weight="500">3 部作品</text>
    
    <!-- Create button -->
    <rect x="300" y="78" width="70" height="36" rx="18" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="335" y="100" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">+ 新建</text>
    
    <!-- Card 1 - Active -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="140" width="350" height="130" rx="16" fill="white" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="20" y="140" width="350" height="130" rx="16" fill="rgba(37,99,235,0.02)"/>
    </g>
    <!-- Active indicator -->
    <rect x="20" y="140" width="3" height="130" rx="1.5" fill="#2563eb"/>
    
    <!-- Book icon 1 -->
    <g transform="translate(38, 160)" filter="url(#iconShadow)">
      <rect width="52" height="64" rx="8" fill="url(#novel1)"/>
      <text x="26" y="42" font-size="24" font-weight="700" fill="white" text-anchor="middle">龙</text>
    </g>
    
    <!-- Title + meta 1 -->
    <text x="104" y="182" font-size="17" font-weight="700" fill="#0f172a">龙族之黄昏</text>
    <rect x="104" y="192" width="44" height="20" rx="6" fill="rgba(37,99,235,0.1)"/>
    <text x="126" y="206" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">当前</text>
    <rect x="154" y="192" width="36" height="20" rx="6" fill="rgba(16,185,129,0.1)"/>
    <text x="172" y="206" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">玄幻</text>
    <rect x="194" y="192" width="36" height="20" rx="6" fill="rgba(79,142,247,0.1)"/>
    <text x="212" y="206" font-size="10" font-weight="600" fill="#4f8ef7" text-anchor="middle">长篇</text>
    
    <text x="104" y="228" font-size="12" fill="#94a3b8" line-height="1.6">一个被放逐的龙族少年，在黄昏中寻找失落的记忆。当世界走向终结，他必须做出选择...</text>
    
    <!-- Stats row 1 -->
    <rect x="20" y="236" width="350" height="32" rx="0" fill="#f1f5f9"/>
    <line x1="137" y1="240" x2="137" y2="264" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="233" y1="240" x2="233" y2="264" stroke="#e2e8f0" stroke-width="1"/>
    <text x="78" y="256" font-size="10" fill="#94a3b8" text-anchor="middle">章数</text>
    <text x="78" y="244" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">128</text>
    <text x="185" y="256" font-size="10" fill="#94a3b8" text-anchor="middle">角色</text>
    <text x="185" y="244" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">24</text>
    <text x="292" y="256" font-size="10" fill="#94a3b8" text-anchor="middle">字数</text>
    <text x="292" y="244" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">42.6万</text>
    
    <!-- Card 2 -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="286" width="350" height="110" rx="16" fill="white"/>
    </g>
    <g transform="translate(38, 306)" filter="url(#iconShadow)">
      <rect width="52" height="64" rx="8" fill="url(#novel2)"/>
      <text x="26" y="42" font-size="24" font-weight="700" fill="white" text-anchor="middle">月</text>
    </g>
    <text x="104" y="328" font-size="17" font-weight="700" fill="#0f172a">月光信笺</text>
    <rect x="104" y="338" width="36" height="20" rx="6" fill="rgba(124,58,237,0.1)"/>
    <text x="122" y="352" font-size="10" font-weight="600" fill="#7c3aed" text-anchor="middle">都市</text>
    <rect x="144" y="338" width="36" height="20" rx="6" fill="rgba(79,142,247,0.1)"/>
    <text x="162" y="352" font-size="10" font-weight="600" fill="#4f8ef7" text-anchor="middle">中篇</text>
    
    <text x="104" y="374" font-size="12" fill="#94a3b8">深夜电台主持人收到一封来自过去的信...</text>
    
    <!-- Stats row 2 -->
    <rect x="20" y="364" width="350" height="32" rx="0" fill="#f1f5f9"/>
    <line x1="137" y1="368" x2="137" y2="392" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="233" y1="368" x2="233" y2="392" stroke="#e2e8f0" stroke-width="1"/>
    <text x="78" y="380" font-size="10" fill="#94a3b8" text-anchor="middle">章数</text>
    <text x="78" y="368" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">36</text>
    <text x="185" y="380" font-size="10" fill="#94a3b8" text-anchor="middle">角色</text>
    <text x="185" y="368" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">12</text>
    <text x="292" y="380" font-size="10" fill="#94a3b8" text-anchor="middle">字数</text>
    <text x="292" y="368" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">8.3万</text>
    
    <!-- Card 3 -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="412" width="350" height="110" rx="16" fill="white"/>
    </g>
    <g transform="translate(38, 432)" filter="url(#iconShadow)">
      <rect width="52" height="64" rx="8" fill="url(#novel3)"/>
      <text x="26" y="42" font-size="24" font-weight="700" fill="white" text-anchor="middle">剑</text>
    </g>
    <text x="104" y="454" font-size="17" font-weight="700" fill="#0f172a">无名剑谱</text>
    <rect x="104" y="464" width="36" height="20" rx="6" fill="rgba(5,150,105,0.1)"/>
    <text x="122" y="478" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">武侠</text>
    <rect x="144" y="464" width="48" height="20" rx="6" fill="rgba(79,142,247,0.1)"/>
    <text x="168" y="478" font-size="10" font-weight="600" fill="#4f8ef7" text-anchor="middle">连载中</text>
    
    <text x="104" y="500" font-size="12" fill="#94a3b8">一把没有名字的剑，一段被遗忘的江湖...</text>
    
    <!-- Stats row 3 -->
    <rect x="20" y="490" width="350" height="32" rx="0" fill="#f1f5f9"/>
    <line x1="137" y1="494" x2="137" y2="518" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="233" y1="494" x2="233" y2="518" stroke="#e2e8f0" stroke-width="1"/>
    <text x="78" y="506" font-size="10" fill="#94a3b8" text-anchor="middle">章数</text>
    <text x="78" y="494" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">67</text>
    <text x="185" y="506" font-size="10" fill="#94a3b8" text-anchor="middle">角色</text>
    <text x="185" y="494" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">18</text>
    <text x="292" y="506" font-size="10" fill="#94a3b8" text-anchor="middle">字数</text>
    <text x="292" y="494" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">15.2万</text>
    
    <!-- Bottom nav -->
    <rect x="0" y="780" width="390" height="64" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Active indicator dot -->
    <circle cx="65" cy="794" r="2" fill="#2563eb"/>
    <!-- 书架 tab (active) -->
    <g opacity="1">
      <text x="65" y="828" font-size="20" fill="#2563eb" text-anchor="middle">📚</text>
      <text x="65" y="816" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">书架</text>
    </g>
    <!-- 对话 tab -->
    <g opacity="0.4">
      <text x="185" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">💬</text>
      <text x="185" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">对话</text>
    </g>
    <!-- 统计 tab -->
    <g opacity="0.4">
      <text x="265" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">📊</text>
      <text x="265" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">统计</text>
    </g>
    <!-- 设置 tab -->
    <g opacity="0.4">
      <text x="325" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">⚙️</text>
      <text x="325" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">设置</text>
    </g>
    
    <!-- Home indicator -->
    <rect x="130" y="836" width="130" height="5" rx="2.5" fill="#1e293b" opacity="0.2"/>
  </g>
</svg>
