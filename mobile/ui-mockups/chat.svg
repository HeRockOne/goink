<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <linearGradient id="assistant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="390" height="844" rx="0"/></clipPath>
  </defs>
  
  <g clip-path="url(#screen)">
    <rect width="390" height="844" fill="url(#bg)"/>
    
    <!-- Status bar -->
    <rect width="390" height="50" fill="#f8f9fb"/>
    <text x="32" y="32" font-size="14" font-weight="600" fill="#1e293b">9:41</text>
    <rect x="308" y="22" width="18" height="10" rx="2" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="310" y="24" width="12" height="6" rx="1" fill="#1e293b"/>
    
    <!-- Header -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">龙族之黄昏 — 对话</text>
      <text x="0" y="22" font-size="12" fill="#94a3b8">AI 创作助手在线</text>
    </g>
    
    <!-- Chat messages -->
    <!-- User message 1 -->
    <g transform="translate(120, 104)">
      <rect width="246" height="52" rx="16" fill="#2563eb"/>
      <text x="16" y="22" font-size="14" fill="white">帮我写第129章的开头，</text>
      <text x="16" y="40" font-size="14" fill="white">苏暮寒发现了龙渊的秘密</text>
    </g>
    
    <!-- Assistant message 1 -->
    <g transform="translate(24, 172)">
      <g transform="translate(0, 0)">
        <rect width="32" height="32" rx="10" fill="url(#assistant)"/>
        <text x="16" y="21" font-size="14" font-weight="600" fill="white" text-anchor="middle">AI</text>
      </g>
      <g transform="translate(42, 0)">
        <rect width="280" height="88" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="22" font-size="14" fill="#334155">第129章 开篇：</text>
        <text x="16" y="42" font-size="14" fill="#334155">夜色如墨，苏暮寒独自站在龙</text>
        <text x="16" y="60" font-size="14" fill="#334155">渊殿外的悬崖边。手中那封密</text>
        <text x="16" y="78" font-size="14" fill="#334155">信已被他反复读了三遍...</text>
      </g>
    </g>
    
    <!-- User message 2 -->
    <g transform="translate(160, 278)">
      <rect width="206" height="34" rx="16" fill="#2563eb"/>
      <text x="16" y="22" font-size="14" fill="white">继续，加入林霜月视角</text>
    </g>
    
    <!-- Assistant message 2 -->
    <g transform="translate(24, 328)">
      <g transform="translate(0, 0)">
        <rect width="32" height="32" rx="10" fill="url(#assistant)"/>
        <text x="16" y="21" font-size="14" font-weight="600" fill="white" text-anchor="middle">AI</text>
      </g>
      <g transform="translate(42, 0)">
        <rect width="280" height="120" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="22" font-size="14" fill="#334155">与此同时，龙渊殿内。</text>
        <text x="16" y="42" font-size="14" fill="#334155">林霜月的手指轻轻划过冰镜的</text>
        <text x="16" y="60" font-size="14" fill="#334155">表面，镜中映出的不是她的倒</text>
        <text x="16" y="78" font-size="14" fill="#334155">影，而是千里之外苏暮寒孤独</text>
        <text x="16" y="96" font-size="14" fill="#334155">的身影。</text>
        <text x="16" y="114" font-size="12" fill="#94a3b8">[已追加到第129章]</text>
      </g>
    </g>
    
    <!-- Tool call indicator -->
    <g transform="translate(24, 464)">
      <g transform="translate(42, 0)">
        <rect width="280" height="40" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="26" font-size="12" fill="#64748b">🔧 调用: append_chapter (第129章, 856字)</text>
      </g>
    </g>
    
    <!-- User message 3 -->
    <g transform="translate(140, 520)">
      <rect width="226" height="34" rx="16" fill="#2563eb"/>
      <text x="16" y="22" font-size="14" fill="white">检查一下和前面章节的连贯性</text>
    </g>
    
    <!-- Assistant message 3 -->
    <g transform="translate(24, 570)">
      <g transform="translate(0, 0)">
        <rect width="32" height="32" rx="10" fill="url(#assistant)"/>
        <text x="16" y="21" font-size="14" font-weight="600" fill="white" text-anchor="middle">AI</text>
      </g>
      <g transform="translate(42, 0)">
        <rect width="280" height="72" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="22" font-size="14" fill="#334155">连贯性检查完成 ✓</text>
        <text x="16" y="42" font-size="14" fill="#334155">• 密信伏笔: 与第125章"破碎</text>
        <text x="16" y="60" font-size="14" fill="#334155">的誓言"衔接良好</text>
      </g>
    </g>
    
    <!-- Input bar -->
    <g transform="translate(0, 730)">
      <rect width="390" height="56" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
      <g transform="translate(16, 10)">
        <rect width="300" height="36" rx="18" fill="#f1f5f9"/>
        <text x="16" y="24" font-size="14" fill="#94a3b8">输入消息...</text>
      </g>
      <circle cx="346" cy="28" r="18" fill="#2563eb"/>
      <text x="346" y="33" font-size="14" fill="white" text-anchor="middle">↑</text>
    </g>
    
    <!-- Bottom nav -->
    <rect x="0" y="780" width="390" height="64" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
    <g opacity="0.4">
      <text x="65" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">📚</text>
      <text x="65" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">书架</text>
    </g>
    <g opacity="1">
      <circle cx="185" cy="794" r="2" fill="#2563eb"/>
      <text x="185" y="828" font-size="20" fill="#2563eb" text-anchor="middle">💬</text>
      <text x="185" y="816" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">对话</text>
    </g>
    <g opacity="0.4">
      <text x="265" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">📊</text>
      <text x="265" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">统计</text>
    </g>
    <g opacity="0.4">
      <text x="325" y="828" font-size="20" fill="#94a3b8" text-anchor="middle">⚙️</text>
      <text x="325" y="816" font-size="11" fill="#94a3b8" text-anchor="middle">设置</text>
    </g>
    <rect x="130" y="836" width="130" height="5" rx="2.5" fill="#1e293b" opacity="0.2"/>
  </g>
</svg>
