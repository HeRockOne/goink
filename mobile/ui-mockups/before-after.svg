<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="novel1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="before"><rect x="20" y="40" width="170" height="340" rx="12"/></clipPath>
    <clipPath id="after"><rect x="450" y="40" width="170" height="340" rx="12"/></clipPath>
  </defs>
  
  <!-- Title -->
  <text x="420" y="30" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Before → After</text>
  
  <!-- BEFORE -->
  <text x="105" y="65" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">❌ 当前状态</text>
  
  <g filter="url(#shadow)">
    <g clip-path="url(#before)">
      <rect x="20" y="40" width="170" height="340" fill="#f5f5f5"/>
      
      <!-- Status bar -->
      <rect x="20" y="40" width="170" height="20" fill="#e5e5e5"/>
      <text x="30" y="54" font-size="8" fill="#333">9:41</text>
      
      <!-- Duplicate headers -->
      <rect x="20" y="60" width="170" height="16" fill="#d4d4d4"/>
      <text x="28" y="72" font-size="9" fill="#333">小说</text>
      
      <rect x="20" y="76" width="170" height="20" fill="#e5e5e5"/>
      <text x="28" y="90" font-size="11" font-weight="700" fill="#333">书架</text>
      
      <!-- Ugly card -->
      <rect x="28" y="102" width="154" height="60" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <rect x="34" y="108" width="28" height="32" rx="4" fill="#ccc"/>
      <text x="48" y="128" font-size="12" font-weight="600" fill="#333">龙</text>
      <text x="68" y="118" font-size="8" fill="#666">龙族之黄昏</text>
      <text x="68" y="130" font-size="7" fill="#999">128章 · 42.6万字</text>
      <text x="68" y="142" font-size="7" fill="#999">玄幻 · 长篇</text>
      
      <!-- Stats row (ugly) -->
      <rect x="28" y="162" width="154" height="20" fill="#e5e5e5"/>
      <text x="60" y="175" font-size="7" fill="#666">128章 24角色 42.6万</text>
      
      <!-- Second card -->
      <rect x="28" y="190" width="154" height="60" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <rect x="34" y="196" width="28" height="32" rx="4" fill="#ccc"/>
      <text x="48" y="216" font-size="12" font-weight="600" fill="#333">月</text>
      <text x="68" y="206" font-size="8" fill="#666">月光信笺</text>
      <text x="68" y="218" font-size="7" fill="#999">36章 · 8.3万字</text>
      
      <!-- Bottom nav (with stats_label) -->
      <rect x="20" y="340" width="170" height="40" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <text x="45" y="365" font-size="7" fill="#999">📚 书架</text>
      <text x="80" y="365" font-size="7" fill="#999">💬 对话</text>
      <text x="112" y="365" font-size="7" fill="#ef4444" font-weight="600">📊 stats_label</text>
      <text x="150" y="365" font-size="7" fill="#999">⚙️ 设置</text>
    </g>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(395, 180)">
    <circle cx="25" cy="25" r="25" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="32" font-size="20" fill="#2563eb" text-anchor="middle">→</text>
  </g>
  
  <!-- AFTER -->
  <text x="535" y="65" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">✅ 目标效果</text>
  
  <g filter="url(#shadow)">
    <g clip-path="url(#after)">
      <rect x="450" y="40" width="170" height="340" fill="#f8f9fb"/>
      
      <!-- Status bar -->
      <rect x="450" y="40" width="170" height="20" fill="#f8f9fb"/>
      <text x="460" y="54" font-size="8" fill="#333">9:41</text>
      
      <!-- Clean header -->
      <text x="458" y="78" font-size="14" font-weight="800" fill="#0f172a">书架</text>
      <text x="458" y="90" font-size="7" fill="#94a3b8">3 部作品</text>
      
      <!-- Create button -->
      <rect x="578" y="66" width="36" height="20" rx="10" fill="none" stroke="#2563eb" stroke-width="1"/>
      <text x="596" y="80" font-size="7" font-weight="600" fill="#2563eb" text-anchor="middle">+ 新建</text>
      
      <!-- Card 1 - Active -->
      <rect x="458" y="102" width="154" height="70" rx="10" fill="white" stroke="#2563eb" stroke-width="1"/>
      <rect x="458" y="102" width="2" height="70" rx="1" fill="#2563eb"/>
      
      <!-- Book icon -->
      <rect x="464" y="108" width="26" height="32" rx="5" fill="url(#novel1)"/>
      <text x="477" y="128" font-size="12" font-weight="700" fill="white" text-anchor="middle">龙</text>
      
      <!-- Title + tags -->
      <text x="496" y="118" font-size="9" font-weight="700" fill="#0f172a">龙族之黄昏</text>
      <rect x="496" y="122" width="22" height="10" rx="3" fill="rgba(37,99,235,0.1)"/>
      <text x="507" y="130" font-size="5" font-weight="600" fill="#2563eb" text-anchor="middle">当前</text>
      <rect x="520" y="122" width="20" height="10" rx="3" fill="rgba(16,185,129,0.1)"/>
      <text x="530" y="130" font-size="5" font-weight="600" fill="#059669" text-anchor="middle">玄幻</text>
      
      <text x="496" y="148" font-size="6" fill="#94a3b8">一个被放逐的龙族少年...</text>
      
      <!-- Stats row -->
      <rect x="458" y="154" width="154" height="16" fill="#f1f5f9"/>
      <line x1="510" y1="157" x2="510" y2="167" stroke="#e2e8f0" stroke-width="0.5"/>
      <line x1="562" y1="157" x2="562" y2="167" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="484" y="163" font-size="5" fill="#94a3b8">128章</text>
      <text x="536" y="163" font-size="5" fill="#94a3b8">24角色</text>
      <text x="588" y="163" font-size="5" fill="#94a3b8">42.6万</text>
      
      <!-- Card 2 -->
      <rect x="458" y="182" width="154" height="52" rx="10" fill="white"/>
      <rect x="464" y="188" width="26" height="32" rx="5" fill="#7c3aed"/>
      <text x="477" y="208" font-size="12" font-weight="700" fill="white" text-anchor="middle">月</text>
      <text x="496" y="198" font-size="9" font-weight="700" fill="#0f172a">月光信笺</text>
      <rect x="496" y="202" width="20" height="10" rx="3" fill="rgba(124,58,237,0.1)"/>
      <text x="506" y="210" font-size="5" font-weight="600" fill="#7c3aed" text-anchor="middle">都市</text>
      <text x="496" y="224" font-size="6" fill="#94a3b8">36章 · 8.3万字</text>
      
      <!-- Card 3 -->
      <rect x="458" y="242" width="154" height="52" rx="10" fill="white"/>
      <rect x="464" y="248" width="26" height="32" rx="5" fill="#059669"/>
      <text x="477" y="268" font-size="12" font-weight="700" fill="white" text-anchor="middle">剑</text>
      <text x="496" y="258" font-size="9" font-weight="700" fill="#0f172a">无名剑谱</text>
      <rect x="496" y="262" width="20" height="10" rx="3" fill="rgba(5,150,105,0.1)"/>
      <text x="506" y="270" font-size="5" font-weight="600" fill="#059669" text-anchor="middle">武侠</text>
      <text x="496" y="284" font-size="6" fill="#94a3b8">67章 · 15.2万字</text>
      
      <!-- Bottom nav -->
      <rect x="450" y="340" width="170" height="40" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
      <circle cx="485" cy="344" r="1.5" fill="#2563eb"/>
      <text x="485" y="365" font-size="7" fill="#2563eb">📚 书架</text>
      <text x="520" y="365" font-size="7" fill="#999">💬 对话</text>
      <text x="552" y="365" font-size="7" fill="#999">📊 统计</text>
      <text x="585" y="365" font-size="7" fill="#999">⚙️ 设置</text>
    </g>
  </g>
  
  <!-- Key improvements -->
  <g transform="translate(20, 400)">
    <rect width="800" height="90" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="400" y="24" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">核心改进</text>
    <text x="40" y="48" font-size="11" fill="#334155">✅ 消除重复标题</text>
    <text x="170" y="48" font-size="11" fill="#334155">✅ 修复 stats_label i18n</text>
    <text x="330" y="48" font-size="11" fill="#334155">✅ 卡片有层次感</text>
    <text x="480" y="48" font-size="11" fill="#334155">✅ 标签系统化</text>
    <text x="40" y="68" font-size="11" fill="#334155">✅ 底部导航活跃指示点</text>
    <text x="220" y="68" font-size="11" fill="#334155">✅ 书架创作入口突出</text>
    <text x="400" y="68" font-size="11" fill="#334155">✅ 视觉深度（阴影+渐变）</text>
    <text x="600" y="68" font-size="11" fill="#334155">✅ 详情页 header 有信息</text>
  </g>
</svg>
