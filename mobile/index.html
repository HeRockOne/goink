<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
<title>Goink — 太虚剑宗</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
<script src="marked.min.js"></script>
<script src="jsQR.js"></script>
<script src="idb-keyval.min.js"></script>
<script type="module">
  import { connect } from './wspulse.mjs';
  window.pulseConnect = connect;
</script>
</head>
<body>
  <!-- 顶部栏 -->
  <header id="appHeader">
    <h1 id="pageTitle">小说</h1>
    <div id="headerActions"></div>
  </header>

  <!-- 主内容区 -->
  <main id="appMain">
    <!-- 小说列表（首页） -->
    <div id="page-novels" class="page active">
      <div id="novelList" class="scroll-area"></div>
    </div>

    <!-- 小说详情 -->
    <div id="page-novel-detail" class="page">
      <div id="novelDetailHeader" class="novel-detail-header"></div>
      <div id="novelDetailTabs" class="tab-bar"></div>
      <div id="novelDetailContent" class="scroll-area"></div>
    </div>

    <!-- 对话页 -->
    <div id="page-chat" class="page">
      <div id="chatBanner" class="chat-banner"></div>
      <div id="chatMessages" class="scroll-area chat-scroll"></div>
      <button id="scrollToBottom" class="scroll-bottom-btn hidden" onclick="scrollToBottom()">↓</button>
      <div id="chatInput" class="chat-input">
        <div class="input-row">
          <textarea id="msgInput" placeholder="输入消息..." rows="1"></textarea>
          <button id="sendBtn" class="btn-send" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
          <button id="stopBtn" class="btn-stop hidden">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 设置页 -->
    <div id="page-settings" class="page">
      <div id="settingsContent" class="scroll-area settings-scroll"></div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav id="bottomNav">
    <button class="nav-item active" data-page="novels">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span>书架</span>
    </button>
    <button class="nav-item" data-page="chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>对话</span>
    </button>
    <button class="nav-item" data-page="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <!-- 模型选择弹窗 -->
  <div id="modelSheet" class="sheet hidden">
    <div class="sheet-overlay" onclick="closeSheet('modelSheet')"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <h3>选择模型</h3>
      <div id="modelList" class="model-list"></div>
    </div>
  </div>

  <!-- 历史会话弹窗 -->
  <div id="sessionSheet" class="sheet hidden">
    <div class="sheet-overlay" onclick="closeSheet('sessionSheet')"></div>
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <h3>历史会话</h3>
      <div id="sessionList" class="session-list"></div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div id="detailSheet" class="sheet hidden">
    <div class="sheet-overlay" onclick="closeSheet('detailSheet')"></div>
    <div class="sheet-content sheet-full">
      <div class="sheet-handle"></div>
      <h3 id="detailTitle"></h3>
      <div id="detailBody" class="scroll-area"></div>
    </div>
  </div>

  <!-- 全屏阅读器 -->
  <div id="readerSheet" class="reader-sheet hidden">
    <!-- 阅读器顶部栏 -->
    <div class="reader-header">
      <button onclick="closeReader()" class="reader-close" title="关闭">✕</button>
      <span id="readerTitle" class="reader-title">章节标题</span>
      <button onclick="showChapterList()" class="reader-close" title="目录">☰</button>
      <button onclick="toggleReaderSettings()" class="reader-close" title="设置">⚙</button>
    </div>
    <!-- 阅读器设置（默认隐藏） -->
    <div class="reader-settings hidden" id="readerSettingsPanel">
      <div class="reader-setting"><label>字号</label><input type="range" id="rsFontSize" min="14" max="24" value="17" oninput="updateReaderSetting('fontSize', this.value)"><span id="rsFontSizeVal" class="reader-val">17</span></div>
      <div class="reader-setting"><label>行距</label><input type="range" id="rsLineHeight" min="1.4" max="2.4" step="0.1" value="1.8" oninput="updateReaderSetting('lineHeight', this.value)"><span id="rsLineHeightVal" class="reader-val">1.8</span></div>
    </div>
    <!-- 章节目录面板（内嵌，默认隐藏） -->
    <div id="chapterListPanel" class="chapter-list-panel hidden">
      <div id="chapterListBody" class="scroll-area" style="max-height:50vh"></div>
    </div>
    <!-- 阅读内容 -->
    <div id="readerContent" class="reader-content"></div>
    <!-- 底部工具栏 -->
    <div class="reader-toolbar">
      <button id="readerPrev" onclick="prevChapter()" class="reader-nav-btn">‹ 上一章</button>
      <span id="readerProgress" class="reader-progress">1/1</span>
      <button id="readerNext" onclick="nextChapter()" class="reader-nav-btn">下一章 ›</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- ═══════════════════ Templates ═══════════════════ -->

  <!-- 小说卡片 -->
  <template id="tpl-novel-card">
    <div class="novel-card">
      <div class="novel-card-top">
        <div class="novel-icon nv-icon">?</div>
        <div class="novel-info">
          <div class="novel-title nv-title"></div>
          <div class="novel-meta-row nv-meta"></div>
          <div class="novel-desc nv-desc"></div>
        </div>
      </div>
      <div class="novel-stats nv-stats">
        <span class="novel-stat-item nv-stat-ch"><strong>0</strong></span>
        <span class="novel-stat-item nv-stat-char"><strong>0</strong></span>
        <span class="novel-stat-item nv-stat-wd"></span>
        <span class="novel-stat-item nv-stat-dt"></span>
      </div>
    </div>
  </template>

  <!-- 通用数据卡片 -->
  <template id="tpl-data-card">
    <div class="data-card">
      <div class="data-card-header">
        <span class="data-card-badge dc-badge">?</span>
        <div class="data-card-body">
          <div class="data-card-title dc-title"></div>
          <div class="data-card-sub dc-sub"></div>
          <div class="data-card-meta dc-meta"></div>
        </div>
        <span class="data-card-arrow dc-arrow">›</span>
      </div>
    </div>
  </template>

  <!-- 折叠分组 -->
  <template id="tpl-collapse">
    <div class="collapse-group">
      <div class="collapse-header" onclick="toggleGroup(this)">
        <span class="collapse-icon">▸</span>
        <span class="collapse-title c-title"></span>
        <span class="collapse-count c-count">0</span>
      </div>
      <div class="collapse-body hidden c-body"></div>
    </div>
  </template>

  <!-- 对话消息 -->
  <template id="tpl-chat-msg">
    <div class="msg">
      <div class="msg-avatar cm-av">AI</div>
      <div class="msg-body">
        <div class="msg-bubble cm-bubble"></div>
        <div class="msg-actions">
          <button class="cm-copy" onclick="copyText(this.closest('.msg').querySelector('.msg-bubble').textContent)">复制</button>
        </div>
      </div>
    </div>
  </template>

  <!-- 章节目录项 -->
  <template id="tpl-ch-list">
    <div class="ch-list-item">
      <span class="ch-list-num ch-num">0</span>
      <span class="ch-list-title ch-title"></span>
    </div>
  </template>

  <!-- 模型选择项 -->
  <template id="tpl-model-item">
    <div class="model-item" onclick="selectModel(this.dataset.key)">
      <div class="model-name mod-name"></div>
    </div>
  </template>

  <!-- 会话列表项 -->
  <template id="tpl-session-item">
    <div class="session-item" onclick="loadSession(this.dataset.sid);closeSheet('sessionSheet')">
      <div class="session-title s-title"></div>
      <div class="session-phase s-phase"></div>
    </div>
  </template>

  <!-- 空状态 -->
  <template id="tpl-empty">
    <div class="empty-state">
      <p class="em-text"></p>
      <span class="hint em-hint"></span>
    </div>
  </template>

  <!-- 标签 -->
  <template id="tpl-tag">
    <span class="tag"></span>
  </template>

  <!-- 信息行 -->
  <template id="tpl-info-row">
    <div class="info-row">
      <span class="info-label ir-lbl"></span>
      <span class="ir-val"></span>
    </div>
  </template>

  <!-- 设置值行 -->
  <template id="tpl-setting-row">
    <div class="setting-value" onclick="">
      <span class="sv-label"></span>
      <strong class="sv-val"></strong>
    </div>
  </template>

  <!-- Token 输入弹窗 -->
  <template id="tpl-token-prompt">
    <div id="tokenOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)closeSheet('tokenOverlay')">
      <div style="background:var(--surface-raised);border-radius:var(--radius-xl);padding:24px;width:85%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.2);border:1px solid var(--border);border-top:2px solid var(--ice)">
        <h3 style="font-size:15px;font-weight:700;margin-bottom:8px;color:var(--ice);letter-spacing:1px;padding-left:10px;border-left:2px solid var(--ice)">🔐 访问验证</h3>
        <p style="font-size:12px;color:var(--text2);margin-bottom:14px">首次连接需输入令牌，请在桌面端「设置」中查看或扫描二维码。</p>
        <input id="tokenInput" type="text" placeholder="输入 32 位令牌" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:monospace;margin-bottom:12px;outline:none;box-sizing:border-box;background:var(--bg);color:var(--text)">
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <button id="tokenSave" style="flex:1;padding:9px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--ice),var(--ice-light));color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px var(--blood-glow)">连接</button>
          <button id="tokenCancel" style="padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">跳过</button>
        </div>
        <button id="tokenScan" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer">📷 扫描二维码</button>
      </div>
    </div>
  </template>

  <!-- QR 扫描弹窗 -->
  <template id="tpl-qr-scan">
    <div id="qrScanOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:1000;display:flex;flex-direction:column">
      <div style="flex:1;position:relative;overflow:hidden">
        <video id="qrVideo" style="width:100%;height:100%;object-fit:cover" autoplay playsinline></video>
        <canvas id="qrCanvas" style="display:none"></canvas>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border:2px solid var(--ice);border-radius:var(--radius);pointer-events:none;box-shadow:0 0 20px var(--blood-glow)"></div>
      </div>
      <div style="padding:16px;text-align:center;background:var(--surface);backdrop-filter:var(--surface-blur);border-top:1px solid var(--border)">
        <p style="font-size:14px;color:var(--text);margin-bottom:12px">将二维码放入框内</p>
        <button id="qrCancel" style="padding:8px 28px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">取消</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
