<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>goink-frontend</title>
  </head>
  <script>
    (function () {
      var t = localStorage.getItem('theme')
      if (t === 'dark' || (t === 'light')) {
        document.documentElement.setAttribute('data-theme', t)
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
      // 渲染前应用全局字号/字体：避免首帧后 rem 单位重排导致布局错位（状态栏/面板间空白）
      var fs = localStorage.getItem('global_font_size')
      if (fs) document.documentElement.style.setProperty('--font-size', fs)
      var font = localStorage.getItem('global_display_font')
      if (font) {
        document.documentElement.style.setProperty('--font-display', font)
        document.documentElement.style.setProperty('--font-body', font)
      }
    })()
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
