<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="KaiTi, STKaiti, serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="0.45" stop-color="#0e1522"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#6b8fad" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6b8fad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.7" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#a1c4d6" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#a1c4d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a1c4d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a1c4d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a1c4d6" stop-opacity="0"/>
    </linearGradient>
    <!-- 剑气渐变：头部亮白 → 青蓝 → 透明拖尾 -->
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a1c4d6" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#a1c4d6" stop-opacity="0.7"/>
      <stop offset="0.85" stop-color="#e8f4ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b8fad" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6b8fad" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#c8e4f4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8f4ff" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glowFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 剑气飞行路径 -->
    <path id="bladePath1" d="M -200,140 C 150,60 500,240 1400,90" fill="none"/>
    <path id="bladePath2" d="M -200,520 C 300,430 700,560 1400,470" fill="none"/>
    <path id="particlePath" d="M 100,720 C 200,300 400,120 600,60" fill="none"/>
    <path id="particlePath2" d="M 900,720 C 980,380 1050,200 1150,40" fill="none"/>
  </defs>

  <!-- ═══ 背景层 ═══ -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <rect width="1200" height="720" fill="url(#glow1)"/>
  <rect width="1200" height="720" fill="url(#glow2)"/>

  <!-- 斜线纹理 -->
  <g stroke="#a1c4d6" stroke-opacity="0.03" stroke-width="1">
    <line x1="-50" y1="250" x2="150" y2="50"/><line x1="100" y1="250" x2="300" y2="50"/>
    <line x1="250" y1="250" x2="450" y2="50"/><line x1="400" y1="250" x2="600" y2="50"/>
    <line x1="550" y1="250" x2="750" y2="50"/><line x1="700" y1="250" x2="900" y2="50"/>
    <line x1="850" y1="250" x2="1050" y2="50"/><line x1="1000" y1="250" x2="1200" y2="50"/>
  </g>

  <!-- 山峦 -->
  <path d="M0,720 L0,640 Q100,600 220,635 Q340,580 460,625 Q580,560 700,615 Q820,575 940,625 Q1060,590 1200,630 L1200,720 Z" fill="#0d1420" opacity="0.9"/>
  <path d="M0,720 L0,660 Q140,620 300,655 Q460,605 620,650 Q780,610 940,655 Q1080,625 1200,655 L1200,720 Z" fill="#0a0e17" opacity="0.75"/>
  <path d="M0,720 L0,680 Q200,650 420,675 Q640,645 860,675 Q1040,655 1200,675 L1200,720 Z" fill="#0d1522" opacity="0.9"/>

  <!-- 山间雾气（缓慢横移） -->
  <g filter="url(#soft)" opacity="0.25">
    <ellipse cx="200" cy="660" rx="280" ry="26" fill="#a1c4d6">
      <animateTransform attributeName="transform" type="translate" values="-60,0;60,0;-60,0" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="665" rx="320" ry="30" fill="#6b8fad">
      <animateTransform attributeName="transform" type="translate" values="50,0;-70,0;50,0" dur="32s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ═══ 背景光晕呼吸 ═══ -->
  <circle cx="600" cy="360" r="420" fill="url(#glow2)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ 剑气一：横贯长空（大剑气，慢速，偶尔感） ═══ -->
  <g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.12;0.2;0.8;0.88;1" dur="8s" repeatCount="indefinite"/>
      <!-- 拖尾光带 -->
      <path d="M -240,140 C 150,60 500,240 1400,90" fill="none" stroke="url(#bladeGrad)" stroke-width="3" filter="url(#soft)" opacity="0.5">
        <animate attributeName="stroke-dasharray" values="0 2200;2000 2200" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- 剑气主体（细长光梭） -->
      <g filter="url(#glowFilter)">
        <animateMotion dur="1.4s" repeatCount="indefinite" rotate="auto">
          <mpath href="#bladePath1"/>
        </animateMotion>
        <path d="M -36,0 L 36,0 L 42,3 L 36,6 L -36,6 Z" fill="url(#bladeGrad)"/>
        <circle cx="44" cy="3" r="4" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- ═══ 剑气二：低空掠过（聊天面板前） ═══ -->
  <g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7;0;0" keyTimes="0;0.6;0.68;0.92;0.97;1" dur="11s" repeatCount="indefinite"/>
      <path d="M -240,520 C 300,430 700,560 1400,470" fill="none" stroke="url(#bladeGrad2)" stroke-width="2" filter="url(#soft)" opacity="0.45">
        <animate attributeName="stroke-dasharray" values="0 2200;1900 2200" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <g filter="url(#glowFilter)">
        <animateMotion dur="2.2s" repeatCount="indefinite" rotate="auto">
          <mpath href="#bladePath2"/>
        </animateMotion>
        <path d="M -28,0 L 28,0 L 33,2.5 L 28,5 L -28,5 Z" fill="url(#bladeGrad2)"/>
        <circle cx="34" cy="2.5" r="3" fill="#e8f4ff"/>
      </g>
    </g>
  </g>

  <!-- ═══ 剑气三：挥剑弧光（编辑器左侧，残影划光） ═══ -->
  <g opacity="0.7">
    <path d="M 300,180 C 260,260 300,380 380,440" fill="none" stroke="url(#bladeGrad2)" stroke-width="2.5" filter="url(#soft)"
      stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 600;560 600" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0;0" keyTimes="0;0.35;0.6;1" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <!-- 剑尖光点 -->
    <circle r="3.5" fill="#e8f4ff" filter="url(#glowFilter)">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.65" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="300;380" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;440" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ═══ 剑意粒子流（沿曲线上升，前后交错） ═══ -->
  <g>
    <circle r="2" fill="#a1c4d6" filter="url(#glowFilter)">
      <animateMotion dur="7s" repeatCount="indefinite" begin="0s"><mpath href="#particlePath"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle r="1.5" fill="#a1c4d6" filter="url(#glowFilter)">
      <animateMotion dur="7s" repeatCount="indefinite" begin="2.3s"><mpath href="#particlePath"/></animateMotion>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite" begin="2.3s"/>
    </circle>
    <circle r="1.8" fill="#6b8fad" filter="url(#glowFilter)">
      <animateMotion dur="9s" repeatCount="indefinite" begin="1.1s"><mpath href="#particlePath2"/></animateMotion>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle r="1.3" fill="#6b8fad" filter="url(#glowFilter)">
      <animateMotion dur="9s" repeatCount="indefinite" begin="5.4s"><mpath href="#particlePath2"/></animateMotion>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite" begin="5.4s"/>
    </circle>
  </g>

  <!-- ═══ 顶部标题栏 ═══ -->
  <rect x="0" y="0" width="1200" height="46" fill="#0b0f18" opacity="0.55"/>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#a1c4d6" stroke-opacity="0.18"/>
  <text x="20" y="30" font-size="15" fill="#e8eef2" font-weight="bold" letter-spacing="3">太虚剑宗 · 第一卷</text>
  <text x="400" y="30" font-size="12" fill="#a1c4d6" opacity="0.75" letter-spacing="2">⚔ 万剑归宗 · 剑气极盛</text>

  <!-- ═══ ActivityBar ═══ -->
  <rect x="0" y="46" width="56" height="648" fill="#0b0f18" opacity="0.5"/>
  <line x1="56" y1="46" x2="56" y2="694" stroke="#a1c4d6" stroke-opacity="0.14"/>
  <g text-anchor="middle">
    <circle cx="28" cy="88" r="16" fill="#a1c4d6" fill-opacity="0.14" filter="url(#glowFilter)">
      <animate attributeName="fill-opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <rect x="20" y="80" width="16" height="16" rx="3" fill="none" stroke="#a1c4d6" stroke-width="1.4"/>
    <text x="28" y="142" font-size="13" fill="#8aa8c0">卷</text>
    <text x="28" y="196" font-size="13" fill="#8aa8c0">角</text>
    <text x="28" y="250" font-size="13" fill="#8aa8c0">色</text>
    <text x="28" y="304" font-size="13" fill="#8aa8c0">界</text>
    <text x="28" y="358" font-size="13" fill="#8aa8c0">物</text>
    <text x="28" y="412" font-size="13" fill="#8aa8c0">线</text>
    <text x="28" y="466" font-size="13" fill="#8aa8c0">笔</text>
    <text x="28" y="520" font-size="13" fill="#8aa8c0">忆</text>
  </g>
  <rect x="52" y="72" width="4" height="32" rx="2" fill="#a1c4d6" filter="url(#glowFilter)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ 侧栏 ═══ -->
  <rect x="56" y="46" width="250" height="648" fill="#0d1420" opacity="0.45"/>
  <line x1="306" y1="46" x2="306" y2="694" stroke="#a1c4d6" stroke-opacity="0.14"/>
  <rect x="56" y="46" width="250" height="2" fill="url(#panelTop)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="72" y="60" width="218" height="28" rx="6" fill="#a1c4d6" fill-opacity="0.07" stroke="#a1c4d6" stroke-opacity="0.22"/>
  <text x="84" y="79" font-size="12" fill="#8aa8c0">⌕ 搜索章节 / 角色 / 设定…</text>
  <g font-size="12.5">
    <text x="72" y="118" fill="#8aa8c0" letter-spacing="2">第一卷 · 初入剑宗</text>
    <rect x="66" y="132" width="230" height="30" rx="6" fill="#a1c4d6" fill-opacity="0.1"/>
    <rect x="66" y="132" width="3" height="30" rx="1.5" fill="#a1c4d6" filter="url(#glowFilter)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="76" y="151" fill="#a1c4d6" font-weight="bold">第 001 章 · 剑起青冥</text>
    <text x="76" y="183" fill="#e8eef2" opacity="0.8">第 002 章 · 万剑归宗</text>
    <text x="76" y="215" fill="#e8eef2" opacity="0.8">第 003 章 · 太虚剑意</text>
    <text x="76" y="247" fill="#e8eef2" opacity="0.8">第 004 章 · 剑气纵横</text>
    <text x="76" y="279" fill="#e8eef2" opacity="0.8">第 005 章 · 剑冢试炼</text>
    <text x="76" y="311" fill="#e8eef2" opacity="0.55">第 006 章 · 峰回路转</text>
    <text x="76" y="343" fill="#e8eef2" opacity="0.55">第 007 章 · 心剑合一</text>
  </g>
  <rect x="66" y="620" width="230" height="58" rx="8" fill="#a1c4d6" fill-opacity="0.06" stroke="#a1c4d6" stroke-opacity="0.18"/>
  <text x="76" y="640" font-size="11" fill="#a1c4d6" opacity="0.8" letter-spacing="2">✦ 世界观 · 太虚剑宗</text>
  <text x="76" y="660" font-size="10.5" fill="#8aa8c0">剑气灵气 · 三境九重天 · 剑冢禁地</text>

  <!-- ═══ 编辑器（实底纸面） ═══ -->
  <rect x="306" y="46" width="578" height="648" fill="#111827" opacity="0.97"/>
  <line x1="884" y1="46" x2="884" y2="694" stroke="#a1c4d6" stroke-opacity="0.12"/>
  <rect x="306" y="46" width="578" height="36" fill="#0e1522" opacity="0.9"/>
  <rect x="320" y="56" width="120" height="22" rx="5" fill="#a1c4d6" fill-opacity="0.12"/>
  <text x="332" y="71" font-size="11.5" fill="#a1c4d6">第 001 章 · 剑起青冥</text>
  <text x="460" y="71" font-size="11.5" fill="#8aa8c0">book-outline.md</text>
  <text x="580" y="71" font-size="11.5" fill="#8aa8c0">goink.md</text>
  <text x="330" y="116" font-size="24" fill="#e8eef2" font-weight="bold" letter-spacing="4" filter="url(#glowFilter)">第一章 · 剑起青冥</text>
  <line x1="330" y1="128" x2="430" y2="128" stroke="#a1c4d6" stroke-opacity="0.5"/>
  <g stroke="#a1c4d6" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <line x1="330" y1="160" x2="820" y2="160"/><line x1="330" y1="184" x2="780" y2="184"/>
    <line x1="330" y1="208" x2="840" y2="208"/><line x1="330" y1="232" x2="790" y2="232"/>
    <line x1="330" y1="256" x2="830" y2="256"/><line x1="330" y1="280" x2="760" y2="280"/>
    <line x1="330" y1="304" x2="820" y2="304"/><line x1="330" y1="328" x2="800" y2="328"/>
    <line x1="330" y1="352" x2="840" y2="352"/>
  </g>
  <text x="330" y="412" font-size="12.5" fill="#a1c4d6" letter-spacing="1">「剑气纵横三万里，一剑光寒十九州。」</text>
  <g stroke="#a1c4d6" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round">
    <line x1="330" y1="446" x2="810" y2="446"/><line x1="330" y1="470" x2="790" y2="470"/>
    <line x1="330" y1="494" x2="830" y2="494"/><line x1="330" y1="518" x2="800" y2="518"/>
  </g>
  <rect x="306" y="670" width="578" height="24" fill="#0e1522" opacity="0.9"/>
  <text x="318" y="686" font-size="10.5" fill="#8aa8c0">3,214 字 · 已保存 ✓</text>
  <text x="560" y="686" font-size="10.5" fill="#8aa8c0">楷体 · 1.8 行距</text>

  <!-- ═══ 聊天面板 ═══ -->
  <rect x="884" y="46" width="316" height="648" fill="#0d1420" opacity="0.5"/>
  <rect x="884" y="46" width="316" height="2" fill="url(#panelTop)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="900" y="64" width="200" height="52" rx="8" fill="#a1c4d6" fill-opacity="0.08" stroke="#a1c4d6" stroke-opacity="0.28"/>
  <text x="912" y="84" font-size="11" fill="#a1c4d6" opacity="0.9">✦ 已读取第一卷设定</text>
  <text x="912" y="102" font-size="10.5" fill="#c8d8e8">章节衔接：第 001 章 → 第 002 章 ✓</text>
  <rect x="900" y="128" width="284" height="36" rx="6" fill="#a1c4d6" fill-opacity="0.06" stroke="#a1c4d6" stroke-opacity="0.2"/>
  <text x="912" y="150" font-size="11" fill="#c8d8e8">⚔ 检索世界观设定 · 完成</text>
  <rect x="1016" y="176" width="168" height="30" rx="8" fill="#a1c4d6"/>
  <text x="1028" y="195" font-size="11" fill="#0a0e17">继续写第二章</text>
  <rect x="900" y="222" width="240" height="60" rx="8" fill="#a1c4d6" fill-opacity="0.08" stroke="#a1c4d6" stroke-opacity="0.28"/>
  <text x="912" y="242" font-size="11" fill="#c8d8e8">第二章将展开太虚剑意的试炼，</text>
  <text x="912" y="260" font-size="11" fill="#c8d8e8">主角在剑冢偶得残剑……</text>
  <rect x="900" y="630" width="284" height="44" rx="8" fill="#a1c4d6" fill-opacity="0.07" stroke="#a1c4d6" stroke-opacity="0.25"/>
  <text x="914" y="657" font-size="12" fill="#8aa8c0">输入指令，或 / 唤起技能…</text>

  <!-- ═══ 底部状态栏 ═══ -->
  <rect x="0" y="694" width="1200" height="26" fill="#0b0f18" opacity="0.55"/>
  <line x1="0" y1="694" x2="1200" y2="694" stroke="#a1c4d6" stroke-opacity="0.14"/>
  <text x="20" y="711" font-size="10.5" fill="#8aa8c0">准备 · 大纲 · 正文 · 审读 · 维护</text>
  <text x="520" y="711" font-size="10.5" fill="#6b8fad">✦ 太虚剑宗 · 剑气极盛</text>
  <text x="900" y="711" font-size="10.5" fill="#8aa8c0">24,861 字 · 今日 3,214 字</text>

  <!-- 面板描边光 -->
  <rect x="56" y="46" width="250" height="648" fill="none" stroke="#a1c4d6" stroke-opacity="0.08"/>
  <rect x="884" y="46" width="316" height="648" fill="none" stroke="#a1c4d6" stroke-opacity="0.08"/>
</svg>
