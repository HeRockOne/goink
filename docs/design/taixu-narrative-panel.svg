    </g>
    <text x="36" y="32" font-size="12" fill="#a1c4d6" letter-spacing="2" filter="url(#glowFilter)">◈ 当前章</text>
    <text x="220" y="32" font-size="11" fill="#8aa8c0">· · ·</text>
    <text x="18" y="66" font-size="11.5" fill="#e8eef2" letter-spacing="1">第一章 · 剑起青冥</text>
    <line x1="18" y1="76" x2="118" y2="76" stroke="#a1c4d6" stroke-opacity="0.4"/>
    <text x="18" y="98" font-size="10.5" fill="#8aa8c0">场景 · 剑冢入口，残剑异动</text>
