    <text x="18" y="152" font-size="10.5" fill="#8aa8c0">情绪 · 敬畏 → 战栗 → 决意</text>
    <text x="18" y="176" font-size="10.5" fill="#a1c4d6">章末钩子 · 剑冢深处，一声低吟</text>
    <rect x="18" y="236" width="224" height="28" rx="6" fill="#a1c4d6" fill-opacity="0.08" stroke="#a1c4d6" stroke-opacity="0.25"/>
    <text x="28" y="254" font-size="10.5" fill="#c8d8e8">进度 3,214 / 3,500 字 · 待审读</text>
    <path d="M 248,268 L 248,276 L 256,276 Z" fill="#a1c4d6" opacity="0.5"/>
  </g>

  <!-- past 过去章节流 -->
